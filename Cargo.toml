[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-only"
authors = ["Adam R Sophie <adamrsophie@gmail.com>"]
repository = "https://github.com/adamrsophie/stanc-rs"
homepage = "https://github.com/adamrsophie/stanc-rs"
keywords = ["stan", "compiler", "bayesian", "probabilistic-programming"]
categories = ["compilers", "mathematics", "science"]

[workspace.dependencies]
stanc-rs-syntax = { path = "crates/stanc-rs-syntax", version = "0.1.0" }
stanc-rs-semantic = { path = "crates/stanc-rs-semantic", version = "0.1.0" }
stanc-rs-codegen = { path = "crates/stanc-rs-codegen", version = "0.1.0" }
stanc-rs-runtime = { path = "crates/stanc-rs-runtime", version = "0.1.0" }
stanc-rs = { path = "crates/stanc-rs", version = "0.1.0" }
serde_json = "1"
stanmath-rs = { git = "https://github.com/adamrsophie/stanmath-rs", rev = "affeffe936faad8156fa4ad539cad1bfb07ba020" }
rand = { version = "0.10", default-features = false, features = ["std_rng"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
float_cmp = "allow"
# NaN must fail constraint checks, which `!(x >= lb)` expresses directly.
neg_cmp_op_on_partial_ord = "allow"
